  <text x="60" y="150" font-family="Georgia, serif" font-size="50" font-weight="900" fill="none" stroke="#ff6b6b" stroke-width="0.6" letter-spacing="-1" opacity="0.35">KAIZEN</text>
  <text x="61" y="196" font-family="Georgia, serif" font-size="42" font-weight="900" fill="#e8e8f0" letter-spacing="7">PIXEL</text>
  <text x="61" y="196" font-family="Georgia, serif" font-size="42" font-weight="900" fill="none" stroke="#6366f1" stroke-width="0.9" letter-spacing="7" opacity="0.55">PIXEL</text>
  <rect x="58" y="207" width="316" height="2" fill="#c0392b" opacity="0.75" rx="1"/>
  <rect x="58" y="210" width="204" height="1" fill="#6366f1" opacity="0.5" rx="1"/>
  <text x="60" y="230" font-family="monospace" font-size="11" fill="#6366f1" letter-spacing="3.5">GAMEDEV  ·  ML  ·  ORIGIN  STORY</text>

