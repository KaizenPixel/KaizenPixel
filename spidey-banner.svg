<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>KaizenPixel Spider-Man Banner</title>
  <style>
    @keyframes swing { 0%{transform:rotate(-18deg)} 50%{transform:rotate(18deg)} 100%{transform:rotate(-18deg)} }
    @keyframes floatspidy { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(8px)} }
    @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
    @keyframes crawl { 0%{transform:translateX(-60px)} 100%{transform:translateX(740px)} }
    @keyframes webdrop { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
    .spidy-swing { transform-origin: 520px 0px; animation: swing 4s ease-in-out infinite; }
    .spidy-float { animation: floatspidy 4s ease-in-out infinite; }
    .spidey-symbol { animation: pulse 2s ease-in-out infinite; }
    .mini-spidy { animation: crawl 14s linear infinite; }
    .web-line { stroke-dasharray: 200; animation: webdrop 1.5s ease forwards; }
  </style>

  <rect width="680" height="260" fill="#0a0a14"/>

  <line x1="0" y1="0" x2="680" y2="260" stroke="#1a1a3a" stroke-width="0.5"/>
