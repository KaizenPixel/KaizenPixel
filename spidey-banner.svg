    <ellipse cx="0" cy="254" rx="3.5" ry="3" fill="#c0392b"/>
    <ellipse cx="-1.5" cy="253" rx="1.5" ry="1.5" fill="#1a1a2e"/>
    <ellipse cx="1.5" cy="253" rx="1.5" ry="1.5" fill="#1a1a2e"/>
    <line x1="-5" y1="253" x2="-9" y2="250" stroke="#c0392b" stroke-width="0.8"/>
