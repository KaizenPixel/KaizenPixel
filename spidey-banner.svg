  <text x="464" y="150" font-family="monospace" font-size="9.5" fill="#c0392b" opacity="0.65" letter-spacing="1">// with great power</text>
  <text x="464" y="164" font-family="monospace" font-size="9.5" fill="#c0392b" opacity="0.65" letter-spacing="1">// comes great</text>
  <text x="464" y="178" font-family="monospace" font-size="9.5" fill="#ff9999" opacity="0.9" letter-spacing="1">// responsibility</text>

