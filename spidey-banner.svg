  <line x1="680" y1="0" x2="0" y2="260" stroke="#1a1a3a" stroke-width="0.5"/>
  <line x1="170" y1="0" x2="0" y2="260" stroke="#1a1a3a" stroke-width="0.5"/>
  <line x1="340" y1="0" x2="0" y2="260" stroke="#1a1a3a" stroke-width="0.5"/>
  <line x1="510" y1="0" x2="0" y2="260" stroke="#1a1a3a" stroke-width="0.5"/>

